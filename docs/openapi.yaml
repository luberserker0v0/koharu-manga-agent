openapi: 3.1.0
info:
  title: Koharu Manga Agent translation revision API
  version: 0.5.0
  description: >-
    Versioned REST contract for text-region inspection and correction,
    selective page retranslation, automatic current-chapter promotion,
    translated-image source mapping, and administrative revision recovery. Other backend endpoints are documented in
    docs/API.md.
servers:
  - url: http://127.0.0.1:4001/api/v1
security:
  - bearerAuth: []
paths:
  /jobs/{jobId}/retranslations:
    post:
      summary: Create a selective page retranslation Job
      operationId: createSelectiveRetranslation
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectiveRetranslationRequest'
      responses:
        '202':
          description: Retranslation queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/Unavailable'
  /jobs/{jobId}/translated-images:
    get:
      summary: List translated images with source and revision identity
      operationId: listTranslatedImages
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Ordered images inside this Job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedImageManifest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /jobs/{jobId}/text-regions:
    get:
      summary: Inspect the immutable text regions used by a Translation Job
      operationId: getTextRegions
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: sourceImageId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Ordered, sanitized text-region snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextRegionSnapshot'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /jobs/{jobId}/text-region-corrections:
    post:
      summary: Correct OCR text or geometry and promote it after successful chapter rebuild
      operationId: createTextRegionCorrection
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextRegionCorrectionRequest'
      responses:
        '202':
          description: Text-region correction Job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/Unavailable'
  /jobs/{rootJobId}/page-revisions:
    get:
      summary: List every immutable page revision and active selection
      operationId: listPageRevisions
      parameters:
        - $ref: '#/components/parameters/RootJobId'
      responses:
        '200':
          description: Chapter page revision family
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageRevisionManifest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /jobs/{rootJobId}/page-revisions/activate:
    post:
      summary: Administratively activate selected page revisions
      operationId: activatePageRevisions
      parameters:
        - $ref: '#/components/parameters/RootJobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [selections]
              properties:
                selections:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/PageRevisionSelection'
      responses:
        '200':
          description: Updated active revision manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageRevisionManifest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    RootJobId:
      name: rootJobId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: Invalid request shape
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Job or revision root not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Retained source data or revision relationship is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Provider, language, instruction, or source selection is unsupported
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Koharu or a required provider catalog is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    TranslationTarget:
      type: object
      additionalProperties: false
      required: [providerId, modelId]
      properties:
        providerId:
          type: string
          minLength: 1
        modelId:
          type: string
          minLength: 1
    SelectiveRetranslationRequest:
      type: object
      additionalProperties: false
      required: [sourceImageIds]
      properties:
        sourceImageIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
        translationTarget:
          $ref: '#/components/schemas/TranslationTarget'
        sourceLanguage:
          type: string
          minLength: 1
        targetLanguage:
          type: string
          minLength: 1
        instructions:
          type: string
          minLength: 1
    RevisionLineage:
      type: object
      required: [rootJobId, parentJobId, reason, sourceImageIds]
      properties:
        rootJobId:
          type: string
        parentJobId:
          type: string
        reason:
          type: string
          enum: [selective_retranslation, text_region_correction]
        sourceImageIds:
          type: array
          items:
            type: string
        baseRegionSetRevisionIds:
          type: array
          items:
            type: string
    Job:
      type: object
      required: [id, type, status, stage]
      properties:
        id:
          type: string
        type:
          const: translation
        status:
          type: string
          enum: [queued, waiting_dependency, running, succeeded, failed, canceled, blocked]
        stage:
          type: string
        revision:
          $ref: '#/components/schemas/RevisionLineage'
        payload:
          type: object
    TranslatedImage:
      type: object
      required:
        - id
        - index
        - sourceImageId
        - sourceOrderIndex
        - revisionId
        - revisionNumber
        - active
        - fileName
        - mediaType
        - size
        - encodedUrl
        - contentUrl
      properties:
        id:
          type: string
        index:
          type: integer
          minimum: 0
        sourceImageId:
          type: string
        sourceOrderIndex:
          type: integer
          minimum: 0
        revisionId:
          type: string
        revisionNumber:
          type: integer
          minimum: 1
        active:
          type: boolean
        fileName:
          type: string
        mediaType:
          type: string
        size:
          type: integer
          minimum: 0
        encodedUrl:
          type: string
        contentUrl:
          type: string
    TranslatedImageManifest:
      type: object
      required: [jobId, rootJobId, count, images]
      properties:
        jobId:
          type: string
        rootJobId:
          type: string
        artifactId:
          type: integer
        sourceFormat:
          type: string
          enum: [image, zip]
        count:
          type: integer
          minimum: 1
        images:
          type: array
          items:
            $ref: '#/components/schemas/TranslatedImage'
    TextRegionGeometry:
      type: object
      additionalProperties: false
      required: [x, y, width, height, rotation]
      properties:
        x:
          type: number
        y:
          type: number
        width:
          type: number
          minimum: 0
        height:
          type: number
          minimum: 0
        rotation:
          type: number
    TextRegion:
      type: object
      additionalProperties: false
      required: [id, readingOrder, geometry, sourceText, translatedText]
      properties:
        id:
          type: string
        readingOrder:
          type: integer
          minimum: 0
        geometry:
          $ref: '#/components/schemas/TextRegionGeometry'
        sourceText:
          type: string
          description: Exact OCR content, including whitespace and line breaks.
        translatedText:
          type: string
        ocrConfidence:
          type: number
        sourceDirection:
          type: string
    TextRegionPage:
      type: object
      additionalProperties: false
      required:
        - sourceImageId
        - sourceOrderIndex
        - sourceFileName
        - pageRevisionId
        - regionSetRevisionId
        - coordinateSpace
        - regions
      properties:
        sourceImageId:
          type: string
        sourceOrderIndex:
          type: integer
          minimum: 0
        sourceFileName:
          type: string
        pageRevisionId:
          type: string
        regionSetRevisionId:
          type: string
        coordinateSpace:
          type: object
          additionalProperties: false
          required: [kind, origin, width, height, rotationUnit]
          properties:
            kind:
              const: source_image_pixels
            origin:
              const: top_left
            width:
              type: number
              exclusiveMinimum: 0
            height:
              type: number
              exclusiveMinimum: 0
            rotationUnit:
              const: degrees_clockwise
        regions:
          type: array
          items:
            $ref: '#/components/schemas/TextRegion'
    TextRegionSnapshot:
      type: object
      additionalProperties: false
      required: [jobId, rootJobId, snapshotFingerprint, pages]
      properties:
        jobId:
          type: string
        rootJobId:
          type: string
        snapshotFingerprint:
          type: string
        pages:
          type: array
          items:
            $ref: '#/components/schemas/TextRegionPage'
    TextRegionCorrectionGeometry:
      type: object
      additionalProperties: false
      required: [x, y, width, height]
      properties:
        x:
          type: number
          minimum: 0
        y:
          type: number
          minimum: 0
        width:
          type: number
          exclusiveMinimum: 0
        height:
          type: number
          exclusiveMinimum: 0
        rotation:
          type: number
          default: 0
    TextRegionCorrection:
      type: object
      additionalProperties: false
      required: [regionId]
      anyOf:
        - required: [sourceText]
        - required: [geometry]
      properties:
        regionId:
          type: string
          minLength: 1
        sourceText:
          type: string
          minLength: 1
          maxLength: 10000
          description: Replacement OCR text. Whitespace and line breaks are preserved exactly.
        geometry:
          $ref: '#/components/schemas/TextRegionCorrectionGeometry'
    TextRegionPageCorrection:
      type: object
      additionalProperties: false
      required: [sourceImageId, baseRegionSetRevisionId, regions]
      properties:
        sourceImageId:
          type: string
          minLength: 1
        baseRegionSetRevisionId:
          type: string
          minLength: 1
        regions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TextRegionCorrection'
    TextRegionCorrectionRequest:
      type: object
      additionalProperties: false
      required: [pages]
      properties:
        pages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TextRegionPageCorrection'
        translationTarget:
          $ref: '#/components/schemas/TranslationTarget'
        sourceLanguage:
          type: string
          minLength: 1
        targetLanguage:
          type: string
          minLength: 1
        instructions:
          type: string
          minLength: 1
        generationOptions:
          type: object
          additionalProperties: true
    PageRevisionSelection:
      type: object
      additionalProperties: false
      required: [sourceImageId, revisionId]
      properties:
        sourceImageId:
          type: string
          minLength: 1
        revisionId:
          type: string
          minLength: 1
    PageRevision:
      type: object
      required: [revisionId, revisionNumber, active, jobId, createdAt, image]
      properties:
        revisionId:
          type: string
        revisionNumber:
          type: integer
          minimum: 1
        active:
          type: boolean
        jobId:
          type: string
        parentJobId:
          type: [string, 'null']
        translationTarget:
          oneOf:
            - $ref: '#/components/schemas/TranslationTarget'
            - type: 'null'
        sourceLanguage:
          type: [string, 'null']
        targetLanguage:
          type: [string, 'null']
        instructions:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        image:
          type: object
          required: [id, index, fileName, mediaType, size, encodedUrl, contentUrl]
          properties:
            id:
              type: string
            index:
              type: integer
            fileName:
              type: string
            mediaType:
              type: string
            size:
              type: integer
            encodedUrl:
              type: string
            contentUrl:
              type: string
    PageRevisionManifest:
      type: object
      required: [rootJobId, sourcePreflightId, pageCount, pages]
      properties:
        rootJobId:
          type: string
        sourcePreflightId:
          type: string
        pageCount:
          type: integer
        pages:
          type: array
          items:
            type: object
            required: [sourceImageId, sourceOrderIndex, activeRevisionId, revisions]
            properties:
              sourceImageId:
                type: string
              sourceOrderIndex:
                type: integer
              sourceFileName:
                type: string
              activeRevisionId:
                type: [string, 'null']
              revisions:
                type: array
                items:
                  $ref: '#/components/schemas/PageRevision'
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
        details:
          type: object
